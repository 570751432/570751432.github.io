<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>网络安全意识演练 Demo</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1a2233; --muted:#6b7688;
  --line:#e4e9f2; --brand:#2f6bff; --ok:#12a15a; --bad:#e8453c;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
code{background:#eef2f9;padding:1px 5px;border-radius:4px;font-size:.9em;}

/* ---------- 通用布局 ---------- */
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 64px;}
.head{text-align:center;margin-bottom:24px;}
.head .badge{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;
  color:var(--brand);background:#e8efff;border-radius:999px;padding:4px 13px;margin-bottom:12px;
}
.head h1{font-size:23px;line-height:1.35;letter-spacing:-.3px;}
.head .sub{color:var(--muted);font-size:14px;margin-top:9px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,40,80,.04);
}
.card h2{font-size:16px;margin-bottom:12px;}
.muted{color:var(--muted);font-size:13.5px;}
.warn-box{
  background:#fff8e8;border:1px solid #ffe0a8;color:#8a5b00;border-radius:11px;
  padding:13px 16px;font-size:13.5px;margin-bottom:16px;
}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding:0 20px;border-radius:9px;border:1px solid transparent;
  font-size:14px;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit;
}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.25);}
.btn.primary:hover{background:#2559dd;transform:translateY(-1px);}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:#c9d5e8;background:#fafcff;}
.btn.big{height:50px;padding:0 30px;font-size:15px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* ---------- 控制台 ---------- */
.qr-box{
  display:flex;justify-content:center;align-items:center;
  background:#fff;border:1px dashed #d6dfee;border-radius:12px;
  padding:18px;min-height:276px;margin:10px 0 16px;
}
#qrcode{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center;}
#qrcode canvas,#qrcode img{width:240px!important;height:240px!important;display:block;}
#qrcode img{position:absolute;top:0;left:0;}
.qr-loading{font-size:13px;color:var(--muted);}
.url-row{display:flex;gap:8px;margin-bottom:16px;}
.url-row input{
  flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:9px;
  padding:0 12px;font-size:13px;color:var(--muted);background:#fafbfe;
  font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;transition:.18s;
}
.url-row input:focus{border-color:#b9cdf5;background:#fff;color:var(--ink);}
.actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- 伪装登录页 ---------- */
.login-page{
  min-height:100vh;min-height:100dvh;
  background:linear-gradient(165deg,#e4f2fd 0%,#f2f8ff 45%,#e8f0fb 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 16px;
}
.login-card{
  width:100%;max-width:352px;background:#fff;border-radius:14px;
  box-shadow:0 10px 44px rgba(20,90,160,.13);padding:34px 26px 22px;text-align:center;
}
.qq-logo{display:flex;justify-content:center;margin-bottom:12px;}
.login-title{font-size:19px;font-weight:600;color:#1a2233;margin-bottom:6px;letter-spacing:.5px;}
.login-sub{font-size:12.5px;color:#93a1b5;margin-bottom:18px;}
.alert-bar{
  display:flex;align-items:center;gap:7px;justify-content:center;
  background:#fff4f3;border:1px solid #ffd9d6;color:#d63b32;
  font-size:12.5px;border-radius:8px;padding:8px 12px;margin-bottom:18px;
}
.alert-dot{width:6px;height:6px;border-radius:50%;background:#e8453c;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(232,69,60,.18);}
.field{margin-bottom:12px;}
.field input{
  width:100%;height:46px;border:1px solid #e2e8f1;background:#f8fafd;
  border-radius:7px;padding:0 14px;font-size:15px;outline:none;
  transition:.2s;font-family:inherit;color:#1a2233;
}
.field input::placeholder{color:#a8b4c6;}
.field input:focus{border-color:#12b7f5;background:#fff;box-shadow:0 0 0 3px rgba(18,183,245,.13);}
.login-btn{
  width:100%;height:46px;border:0;border-radius:7px;margin-top:6px;
  background:linear-gradient(90deg,#12b7f5,#0a9ee0);color:#fff;
  font-size:16px;letter-spacing:5px;font-weight:500;cursor:pointer;
  transition:.2s;font-family:inherit;
}
.login-btn:hover{filter:brightness(1.05);box-shadow:0 6px 18px rgba(18,183,245,.32);}
.login-btn:disabled{opacity:.75;cursor:default;letter-spacing:2px;}
.login-links{
  display:flex;justify-content:center;gap:10px;margin-top:16px;
  font-size:12.5px;color:#7a8ba3;
}
.login-links a:hover{color:#12b7f5;}
.fake-url{
  margin-top:20px;padding-top:14px;border-top:1px solid #f0f3f8;
  font-size:11px;color:#a8b4c6;font-family:ui-monospace,Menlo,Consolas,monospace;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.login-foot{font-size:11px;color:#b0bccd;margin-top:18px;text-align:center;}

/* ---------- 揭晓页 ---------- */
.reveal{text-align:center;}
.reveal-icon{font-size:52px;line-height:1;margin-bottom:14px;}
.reveal h1{font-size:24px;color:#d63b32;margin-bottom:14px;letter-spacing:-.3px;}
.reveal .lead{
  font-size:14.5px;color:#4a566b;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:16px;margin-bottom:18px;text-align:left;
}
.reveal .lead b{color:#12a15a;}
.checklist{list-style:none;display:grid;gap:11px;text-align:left;}
.checklist li{display:flex;gap:11px;font-size:14px;color:#39445a;}
.checklist li::before{
  content:"!";flex:0 0 20px;height:20px;border-radius:50%;
  background:#fdeceb;color:#e8453c;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.checklist li b{color:#1a2233;}

/* ---------- 答题 ---------- */
.q-item{padding:18px 0;border-bottom:1px solid var(--line);}
.q-item:last-child{border-bottom:0;padding-bottom:4px;}
.q-title{display:flex;gap:10px;font-size:15px;font-weight:600;margin-bottom:13px;text-align:left;}
.q-num{
  flex:0 0 22px;height:22px;border-radius:6px;background:#eef3ff;color:var(--brand);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.opts{display:grid;gap:8px;padding-left:32px;}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 13px;
  border:1px solid var(--line);border-radius:9px;cursor:pointer;
  font-size:14px;transition:.15s;background:#fff;text-align:left;
}
.opt:hover{border-color:#c2d3f0;background:#fafcff;}
.opt input{margin-top:4px;accent-color:var(--brand);flex:0 0 auto;cursor:pointer;}
.opt.sel{border-color:var(--brand);background:#f2f6ff;}
.opt.sel span{font-weight:600;color:#1c4fd0;}
.submit-bar{display:flex;justify-content:center;margin-top:22px;}

/* ---------- 结果页 ---------- */
.score-card{
  background:linear-gradient(150deg,#2f6bff,#1d4fd8);color:#fff;
  border-radius:16px;padding:30px 22px;text-align:center;margin-bottom:16px;
  box-shadow:0 10px 30px rgba(47,107,255,.28);
}
.score-num{font-size:52px;font-weight:800;line-height:1;letter-spacing:-2px;}
.score-num span{font-size:20px;font-weight:600;opacity:.72;}
.score-level{font-size:16px;font-weight:700;margin-top:12px;}
.score-tip{font-size:13.5px;opacity:.88;margin-top:8px;line-height:1.65;}
.rev-item{
  border:1px solid var(--line);border-radius:11px;padding:15px 16px;
  margin-bottom:11px;background:#fff;
}
.rev-item.ok{border-left:4px solid var(--ok);}
.rev-item.bad{border-left:4px solid var(--bad);}
.rev-head{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px;}
.rev-tag{
  flex:0 0 auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;
  margin-top:2px;
}
.rev-item.ok .rev-tag{background:#e6f7ee;color:var(--ok);}
.rev-item.bad .rev-tag{background:#fdeceb;color:var(--bad);}
.rev-q{font-size:14px;font-weight:600;line-height:1.55;}
.rev-body{font-size:13.5px;color:#4a566b;display:grid;gap:5px;padding-left:4px;}
.rev-body b{color:#1a2233;}
.rev-exp{background:#f7f9fd;border-radius:8px;padding:9px 12px;margin-top:4px;line-height:1.65;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   网络安全意识演练 Demo
   -------------------------------------------------------------------------
   ⚠️ 本 Demo 仅用于授权的内部安全意识培训。
   · 不采集、不保存、不传输任何用户输入内容
   · 登录页为纯前端模拟，点击登录后立即跳转到教育页
   · 请勿修改后用于真实钓鱼用途，否则可能违反《网络安全法》《刑法》第285条
   ========================================================================= */

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================ 题库 ============================ */
const QUESTIONS = [
  {
    q:'收到一封邮件，标题是"【紧急】您的账号存在异常登录，请立即点击链接验证身份"，最恰当的做法是？',
    opts:['立即点击邮件里的链接，按提示输入账号密码进行验证',
          '不点击链接，自己手动在浏览器输入官方网址或打开官方 App 查看账号状态',
          '把邮件转发给同事，问问是不是也收到了',
          '直接回复这封邮件，询问对方是不是官方'],
    a:1,
    exp:'钓鱼邮件最爱制造紧迫感。正确做法是通过官方渠道自行核实，绝不点击邮件里的链接。回复或转发也可能暴露更多信息。'
  },
  {
    q:'扫了一个来路不明的二维码后，跳转到要求输入账号密码的网页。此时应该？',
    opts:['先输入账号密码，看看是不是真的',
          '仔细核对浏览器地址栏的域名，如果不是官方域名就立即关闭',
          '只要页面做得像官方就没问题',
          '输入手机号试试，不输入密码就安全'],
    a:1,
    exp:'二维码本身看不出内容，扫码后一定要看跳转后的网址域名。仿冒页面可以做得和官方一模一样，域名才是关键。'
  },
  {
    q:'关于密码管理，下面哪种做法最安全？',
    opts:['所有网站都用同一个复杂密码，方便记忆',
          '用生日、手机号等个人信息作为密码',
          '不同网站使用不同的密码，并用密码管理器保存，重要账号开启二次验证',
          '把密码记在手机备忘录里'],
    a:2,
    exp:'一个网站泄露，撞库攻击就会拿同一套密码去试其他网站。不同密码 + 密码管理器 + 二次验证是最佳组合。'
  },
  {
    q:'在咖啡厅连接免费公共 Wi-Fi 时，下列哪项操作风险最高？',
    opts:['浏览新闻网页','登录网上银行进行转账','查看已下载好的本地文档','使用地图 App 查路线'],
    a:1,
    exp:'公共 Wi-Fi 可能被他人监听，也可能被伪造成"钓鱼热点"。涉及网银、支付、登录等敏感操作，建议改用手机流量。'
  },
  {
    q:'有人在微信上冒充公司领导，要求你紧急向某个账户转账。最应该做的是？',
    opts:['领导催得急，先转了再说',
          '通过电话或当面等另一种渠道向本人核实',
          '在微信里回复"您真的是领导吗"',
          '先转一小笔试试'],
    a:1,
    exp:'冒充领导/老板是典型的 BEC 诈骗。头像和昵称都能伪造，必须通过独立渠道（打电话、当面）核实身份。'
  },
  {
    q:'判断一个网站是否可信，下面哪个做法最有效？',
    opts:['看网站页面做得好不好看',
          '看地址栏的域名拼写是否正确，是否与官方域名一致',
          '看网站有没有客服电话',
          '看网页打开速度快不快'],
    a:1,
    exp:'域名是网站的"身份证"。仿冒站常用 qq-vip.com、taobao-safe.net 这类相似域名。注意：HTTPS 锁只说明传输加密，不代表网站可信。'
  },
  {
    q:'有人打电话自称"平台客服"，说你的账户有风险，需要你把收到的短信验证码告诉他。应该？',
    opts:['告诉他，反正是客服打来的',
          '只告诉他前三位，后面不告诉',
          '任何情况下都不向他人透露短信验证码，直接挂断并通过官方渠道核实',
          '先告诉他验证码，之后再改密码'],
    a:2,
    exp:'短信验证码是账号的最后一道防线，等同于密码。任何机构的正规客服都不会向你索要验证码。'
  },
  {
    q:'在停车场捡到一个 U 盘，上面贴着"工资表"。最安全的做法是？',
    opts:['插到自己电脑上看看是谁的，好归还',
          '插到公司电脑上打开看看内容',
          '不要插入任何设备，交给 IT 或安保部门处理',
          '先格式化再插电脑'],
    a:2,
    exp:'这是经典的"诱饵 U 盘"攻击（BadUSB）。U 盘可以被植入自动运行的恶意程序，甚至伪装成键盘发起攻击。'
  },
  {
    q:'如果已经在一个可疑网站上输入了账号密码，第一时间应该做什么？',
    opts:['什么都不做，应该没事',
          '立即修改该账号密码，开启二次验证，检查登录记录并上报 IT 部门',
          '先观察几天看看有没有异常',
          '把那个网站举报了就完事'],
    a:1,
    exp:'发现中招要"快"：改密码（其他用相同密码的站点也要改）、开启二次验证、检查异常登录记录、及时上报。'
  },
  {
    q:'关于"二次验证"（2FA / 双重认证），下面说法正确的是？',
    opts:['密码够复杂就不需要二次验证',
          '即使密码泄露，攻击者没有第二个验证因素也无法登录，能显著提升安全性',
          '二次验证会让登录变慢，不推荐使用',
          '只有企业账号才需要二次验证'],
    a:1,
    exp:'二次验证在"你知道的密码"之外，再加一层"你拥有的设备"。绝大多数账号被盗事件，开启 2FA 后都能有效阻断。'
  }
];

/* ============================ 全局状态 ============================ */
const state = { answers: [], score: 0 };

/* ============================ 二维码依赖加载 ============================ */
const QR_CDNS = [
  'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js',
  'https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',
  'https://lib.baomitu.com/qrcodejs/1.0.0/qrcode.min.js'
];

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('load fail: ' + src));
    document.head.appendChild(s);
  });
}

let qrPromise = null;
function ensureQR(){
  if (window.QRCode) return Promise.resolve(true);
  if (qrPromise) return qrPromise;
  qrPromise = (async () => {
    for (const url of QR_CDNS){
      try {
        await loadScript(url);
        if (window.QRCode) return true;
      } catch(e){ /* 尝试下一个 CDN */ }
    }
    return false;
  })();
  return qrPromise;
}

/* ============================ 页面 1：演练控制台 ============================ */
function renderConsole(){
  const isFile = location.protocol === 'file:';
  const basePath = location.href.split('#')[0];
  const defaultUrl = basePath + '#/login';

  app.innerHTML = `
  <div class="wrap">
    <div class="head">
      <div class="badge">网络安全意识演练</div>
      <h1>二维码钓鱼演练 · 演示控制台</h1>
      <p class="sub">本页面仅用于内部安全意识培训，不会采集任何真实账号信息。</p>
    </div>

    ${isFile ? `<div class="warn-box">
      ⚠️ 当前以 <code>file://</code> 方式打开，手机无法扫码访问。请把本文件放到 HTTP 服务器上，
      例如在该目录执行 <code>python -m http.server 8000</code>，再用电脑局域网 IP 访问。
    </div>` : ''}

    <div class="card">
      <h2>① 演练二维码</h2>
      <p class="muted" style="margin-bottom:4px;">把二维码投屏或打印出来，让同事扫码体验"被钓鱼"的过程。</p>
      <div class="qr-box"><div id="qrcode"></div></div>
      <div class="url-row">
        <input id="urlInput" value="${esc(defaultUrl)}" spellcheck="false">
        <button class="btn ghost" id="copyBtn" type="button">复制</button>
      </div>
      <div class="actions">
        <button class="btn primary" id="openBtn" type="button">模拟扫码（打开伪装页）</button>
        <a class="btn ghost" href="#/quiz">跳过演示，直接答题</a>
      </div>
    </div>

    <div class="card">
      <h2>② 演练流程</h2>
      <ul class="checklist">
        <li>同事扫描二维码 → 打开一个"QQ 安全登录"页面</li>
        <li>页面提示"账号异常，请重新验证" → 引导输入账号密码</li>
        <li>点击登录后 → 立即跳转到<b>教育揭晓页</b>，说明这是一次演练</li>
        <li>随后进入 10 道安全知识答题，巩固识别能力</li>
      </ul>
    </div>

    <div class="card">
      <h2>③ 合规说明（务必阅读）</h2>
      <p class="muted">
        本 Demo 为纯前端演示，<b>不含任何后端接口</b>。用户在伪装页输入的内容
        <b>不会被读取、不会被保存、也不会发送到任何服务器</b>。<br><br>
        仅可在<b>获得书面授权的内部安全培训</b>中使用。未经授权对他人实施钓鱼攻击，
        可能违反《中华人民共和国网络安全法》《刑法》第 285 条等法律法规。
      </p>
    </div>
  </div>`;

  const input = document.getElementById('urlInput');

  const draw = (text) => {
    const box = document.getElementById('qrcode');
    if (!box) return;
    box.innerHTML = '<div class="qr-loading">二维码生成中…</div>';
    ensureQR().then(ok => {
      box.innerHTML = '';
      if (ok && window.QRCode){
        new QRCode(box, {
          text, width:240, height:240,
          colorDark:'#101828', colorLight:'#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        const img = new Image();
        img.alt = '二维码';
        img.onerror = () => { box.innerHTML = '<div class="qr-loading">二维码生成失败，请复制下方链接手动发送</div>'; };
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=0&data=' + encodeURIComponent(text);
        box.appendChild(img);
      }
    });
  };

  draw(input.value);

  let timer = null;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => draw(input.value.trim() || 'about:blank'), 450);
  });

  document.getElementById('copyBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(input.value);
    } catch(err){
      input.select();
      try { document.execCommand('copy'); } catch(e2){}
    }
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1400);
  });

  document.getElementById('openBtn').addEventListener('click', () => {
    window.open(input.value.trim() || defaultUrl, '_blank');
  });
}

/* ============================ 页面 4：答题 ============================ */
function renderQuiz(){
  app.innerHTML = `
  <div class="wrap">
    <div class="head">
      <div class="badge">安全知识答题</div>
      <h1>网络安全意识测试</h1>
      <p class="sub">共 ${QUESTIONS.length} 题，全部为单选。提交后可查看每题解析。</p>
    </div>

    <form id="quizForm" onsubmit="return false;">
      <div class="card" id="quizCard"></div>
    </form>

    <div class="submit-bar">
      <button class="btn primary big" id="submitBtn" type="button">提交答卷</button>
    </div>
  </div>`;

  const card = document.getElementById('quizCard');
  card.innerHTML = QUESTIONS.map((item, i) => `
    <div class="q-item">
      <div class="q-title"><span class="q-num">${i+1}</span><span>${esc(item.q)}</span></div>
      <div class="opts">
        ${item.opts.map((o, j) => `
          <label class="opt">
            <input type="radio" name="q${i}" value="${j}">
            <span>${esc(o)}</span>
          </label>`).join('')}
      </div>
    </div>
  `).join('');

  card.querySelectorAll('.opt input').forEach(inp => {
    inp.addEventListener('change', () => {
      card.querySelectorAll(`input[name="${inp.name}"]`).forEach(x => {
        x.closest('.opt').classList.toggle('sel', x.checked);
      });
    });
  });

  document.getElementById('submitBtn').addEventListener('click', submitQuiz);
}

function submitQuiz(){
  const fd = new FormData(document.getElementById('quizForm'));
  const answers = [];
  const missing = [];

  for (let i = 0; i < QUESTIONS.length; i++){
    const v = fd.get('q' + i);
    if (v === null) missing.push(i + 1);
    answers.push(v === null ? -1 : Number(v));
  }

  if (missing.length){
    alert('还有 ' + missing.length + ' 题未作答：第 ' + missing.join('、') + ' 题');
    return;
  }

  state.answers = answers;
  state.score = answers.reduce((s, a, i) => s + (a === QUESTIONS[i].a ? 1 : 0), 0);
  location.hash = '#/result';
}

/* ============================ 页面 5：结果 ============================ */
function renderResult(){
  if (!state.answers.length){ location.hash = '#/quiz'; return; }

  const total = QUESTIONS.length;
  const score = state.score;
  const pct = Math.round(score / total * 100);

  let level, tip;
  if (pct >= 90){ level = '🏆 安全意识很强'; tip = '您已经具备识别绝大多数钓鱼攻击的能力，请继续保持警惕，并把经验分享给身边的同事。'; }
  else if (pct >= 70){ level = '👍 基础不错'; tip = '大部分场景您能做出正确判断，个别知识点还需巩固。看看下面的错题解析吧。'; }
  else if (pct >= 50){ level = '⚠️ 需要加强'; tip = '您能识别一部分风险，但仍有明显的盲区。建议认真阅读每题解析，并参加一次正式的安全培训。'; }
  else { level = '🚨 高风险'; tip = '您很可能成为钓鱼攻击的目标。请务必逐题阅读解析，并牢记：任何索要密码、验证码的页面，先停下来核实。'; }

  const reviewHtml = QUESTIONS.map((item, i) => {
    const mine = state.answers[i];
    const ok = mine === item.a;
    return `
    <div class="rev-item ${ok ? 'ok' : 'bad'}">
      <div class="rev-head">
        <span class="rev-tag">${ok ? '✓ 正确' : '✗ 错误'}</span>
        <span class="rev-q">${i+1}. ${esc(item.q)}</span>
      </div>
      <div class="rev-body">
        <p><b>你的选择：</b>${mine >= 0 ? esc(item.opts[mine]) : '未作答'}</p>
        ${ok ? '' : `<p><b>正确答案：</b>${esc(item.opts[item.a])}</p>`}
        <p class="rev-exp"><b>解析：</b>${esc(item.exp)}</p>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
  <div class="wrap">
    <div class="score-card">
      <div class="score-num">${score}<span>/${total}</span></div>
      <div class="score-level">${level}</div>
      <div class="score-tip">${tip}</div>
    </div>

    <div class="card">
      <h2>📋 逐题解析</h2>
      ${reviewHtml}
    </div>

    <div class="actions" style="justify-content:center;margin-top:20px;">
      <a class="btn primary" href="#/quiz" onclick="state.answers=[];state.score=0;">重新答题</a>
      <a class="btn ghost" href="#/">返回演练控制台</a>
    </div>
  </div>`;
}

/* ============================ 路由 ============================ */
function router(){
  const hash = location.hash || '#/';
  if (hash === '#/login')        renderLogin();
  else if (hash === '#/reveal')  renderReveal();
  else if (hash === '#/quiz')    renderQuiz();
  else if (hash === '#/result')  renderResult();
  else                           renderConsole();
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', router);
router();
